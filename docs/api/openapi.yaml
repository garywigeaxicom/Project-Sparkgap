openapi: 3.1.0
info:
  title: Project Sparkgap Inference API
  version: 0.1.0
  description: >-
    Reference contract for a grounded chat completion endpoint. This contract
    describes the v0.1 vertical slice and is not a production deployment.
servers:
  - url: https://api.example.invalid
    description: Placeholder server; replace for an implementation.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Generate a grounded response
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Complete response or SSE stream when stream is true
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: SSE events followed by data: [DONE].
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller is not authorized for the tenant or data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate or quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 512
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.2
        top_p:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 0.9
        metadata:
          $ref: '#/components/schemas/RequestMetadata'
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 100000
    RequestMetadata:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          maxLength: 128
        use_rag:
          type: boolean
          default: true
        rag_collection:
          type: string
          maxLength: 128
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
        object:
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
                minimum: 0
              message:
                $ref: '#/components/schemas/Message'
              finish_reason:
                type: string
                enum: [stop, length, safety, error]
        usage:
          $ref: '#/components/schemas/Usage'
        rag_sources:
          type: array
          items:
            $ref: '#/components/schemas/RagSource'
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    RagSource:
      type: object
      required: [document_id, chunk_id, score]
      properties:
        document_id:
          type: string
        chunk_id:
          type: string
        title:
          type: string
        score:
          type: number
        url:
          type: string
          format: uri-reference
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
